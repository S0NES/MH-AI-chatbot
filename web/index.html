<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MH AI Chatbot</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <section id="picker" class="screen picker">
    <h1>MH AI Chatbot</h1>
    <p>Choose a game to start.</p>
    <div id="games" class="games"></div>
  </section>

  <section id="chat" class="screen" hidden>
    <header class="topbar">
      <strong id="game-name"></strong>
      <div class="actions">
        <button type="button" id="new-chat" class="link-button">New chat</button>
        <button type="button" id="change-game" class="link-button">Change game</button>
      </div>
    </header>

    <div id="thread" class="thread" aria-live="polite"></div>

    <div class="composer">
      <form id="composer-form">
        <textarea id="question" rows="1" maxlength="400" placeholder="Ask a question" aria-label="Question"></textarea>
        <button id="send" type="submit" aria-label="Send" disabled>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        </button>
      </form>
      <p id="footnote" class="footnote"></p>
    </div>
  </section>

  <script src="/app.js"></script>
</body>
</html>
